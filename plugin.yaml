name: rubal-oracle
version: 0.1.0
description: >
  Say a goal in Hermes chat with a deadline. Afterward Oracle checks proof
  (met / not met / couldn't verify): git, Calendar, GitHub, Notion, Linear,
  Gmail, kanban, Strava, or Apple Health.
author: X0EF
requires_hermes: ">=0.22.7"
homepage: https://github.com/X0EF/rubal-oracle
repository: https://github.com/X0EF/rubal-oracle
provides_tools:
  - oracle_commit
  - oracle_settle
  - oracle_revise
  - oracle_status
  - oracle_mirror
  - oracle_extend
  - oracle_respond_track
  - oracle_backfill
provides_hooks:
  - pre_llm_call
  - post_tool_call
